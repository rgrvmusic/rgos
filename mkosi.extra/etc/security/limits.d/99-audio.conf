# Realtime privileges for the audio group.
#
# This covers interactive sessions and anything started through PAM. For the
# rehosted firmwares themselves the unit file is the authoritative place --
# see etc/systemd/system/regroove-firmware@.service, which sets the same
# limits on the service. Doing it in both places is deliberate: the unit
# applies however the process is started, which is what the shipping image
# needs, while this file is what makes on-device debugging usable.

@audio   -  rtprio     95
@audio   -  memlock    unlimited
