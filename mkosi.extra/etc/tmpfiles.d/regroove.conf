# Directories that live outside the image proper.

# The root partition deliberately excludes /boot/firmware (see
# mkosi.repart/10-root.conf) and the mount point is created by the generated
# fstab. Declaring it here as well means the path still exists -- and still
# looks like a normal directory -- if the mount is skipped, rather than
# surfacing as a confusing "no such file" further down.
d /boot/firmware 0755 root root -

# Rehosted firmwares live outside the OS so they survive image updates. This
# is the unit of work: regroove-firmware@<name>.service expects its userspace
# at /var/lib/regroove/<name>.
d /var/lib/regroove 0755 root root -
