# Root filesystem.
#
# v1 is a single writable root slot. The A/B layout is a deliberate
# follow-up rather than an omission -- see "Open decisions" in
# docs/os-base-decision.md. The structure here (pinned UUID, explicit
# ExcludeFiles) is what a second slot and a verity partition would be
# added alongside, so no rework is needed to get there.

[Partition]
Type=root
Label=regroove-root

# Pinned so cmdline.txt can reference it without an initramfs. Must match
# mkosi.extra/boot/firmware/cmdline.txt and fstab.
UUID=7a1c0de0-0001-4000-8000-000000000001

Format=ext4
CopyFiles=/

# The firmware and kernel are placed on the boot partition by 00-boot.conf.
# Excluding them here avoids shipping roughly 20MB twice and, more
# importantly, avoids the two copies silently diverging.
ExcludeFiles=/boot/firmware

# MountPoint= is deliberately NOT declared for root, and this is a real
# decision rather than an oversight.
#
# mkosi always passes --generate-fstab=/etc/fstab, and repart emits an entry
# for every partition declaring MountPoint=. That entry would read:
#
#     UUID=... / ext4 discard,rw,nodev,suid,exec 0 1
#
# The problem is `discard`. Continuous TRIM on SD and eMMC is a well-known
# source of multi-hundred-millisecond controller stalls, which on a realtime
# audio appliance is a dropout. MountPoint= can only *append* to repart's
# default options -- there is no way to remove discard -- so the only way to
# keep it off the root filesystem is to not generate the entry at all.
#
# The kernel mounts root from cmdline.txt regardless, so omitting this costs
# nothing functionally. Two consequences to be aware of:
#
#   * No fstab entry means no fsck of root at boot. The ext4 journal still
#     recovers from unclean shutdown, which is the common case for a device
#     that gets unplugged. If full fsck matters more than TRIM behaviour,
#     declare MountPoint=/ here and accept discard.
#   * If periodic TRIM is wanted, fstrim.timer is the right mechanism --
#     batched rather than continuous, so stalls land in a predictable window.

# Not Minimize=: the root is writable in v1 and the emulator userspaces
# land under /var, so leave real headroom.
SizeMinBytes=2G
