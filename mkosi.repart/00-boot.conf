# Boot partition for the Raspberry Pi firmware and kernel.
#
# Type= is Microsoft Basic Data, deliberately NOT esp.
#
# The Pi bootloader is not UEFI and does not understand the ESP GPT type.
# When the partition is declared as an ESP, systemd-repart creates it after
# the kernel has been installed and the result is misdetected as FAT16 --
# which the Pi firmware will not boot from. This is a known, reported
# problem: https://github.com/systemd/mkosi/discussions/2642
#
# mkosi invokes systemd-repart with --root= set to the image root, so the
# CopyFiles= source below is relative to that root.

[Partition]
Type=ebd0a0a2-b9e5-4433-87c0-68b6b72699c7
Label=bootfs

# Pinned so the boot partition can be mounted by PARTUUID. Must match
# mkosi.extra/etc/systemd/system/boot-firmware.mount and cmdline.txt.
UUID=7a1c0de0-0000-4000-8000-000000000001

Format=vfat
CopyFiles=/boot/firmware:/

# MountPoint= is deliberately NOT declared here, for two independent reasons.
#
# 1. The fstab entry repart would generate cannot work. mkosi always passes
#    --generate-fstab=/etc/fstab, and for this partition repart writes:
#
#        UUID=170711aa-31ff-4d28-9266-3dab455af761 /boot/firmware vfat ...
#
#    A FAT filesystem cannot hold a UUID -- mkfs.fat has only a 4-byte volume
#    ID -- so udev publishes the short form (1707-11AA) and the long form in
#    the entry never resolves. Measured on a built image: /dev/disk/by-uuid/
#    1707-11AA exists, /dev/disk/by-uuid/170711aa-… does not. With nofail the
#    box still boots, but only after systemd's 90-second device timeout, and
#    /boot/firmware is left unmounted. The UUID is not even stable: repart
#    picks a fresh one each build.
#
# 2. The entry would also carry `discard`, and MountPoint= can only *append*
#    to repart's default options -- there is no way to remove it. Continuous
#    TRIM on SD and eMMC is a known source of controller stalls. This is the
#    same reason 10-root.conf declares no MountPoint= for root.
#
# So the partition is mounted by its pinned PARTUUID instead, from
# mkosi.extra/etc/systemd/system/boot-firmware.mount. Note this means
# /etc/fstab in the image is essentially empty, which is fine: the kernel
# mounts root from cmdline.txt and the unit mounts /boot/firmware.

# Do not shrink this. At 512M, mkfs.vfat's cluster-count heuristic selects
# FAT32, which is what the Pi firmware requires. A smaller partition can
# come out as FAT16 and will not boot, which is the same failure mode as
# using Type=esp. Confirm with: file -s /dev/sdX1  (expect "FAT (32 bit)")
SizeMinBytes=512M
SizeMaxBytes=512M
