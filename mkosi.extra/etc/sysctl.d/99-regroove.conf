# Latency tuning for a single-purpose audio appliance.

# RT throttling is off. On a general-purpose box this is dangerous -- a
# spinning RT thread can wedge the machine with no way back. Here the RT
# threads are a known, fixed set belonging to one rehosted firmware, and
# the default 5%-per-second cap would inject dropouts into the audio path.
kernel.sched_rt_runtime_us = -1

# Keep the kernel from reclaiming the emulator's working set under pressure.
vm.swappiness = 10
