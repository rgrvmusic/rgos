# RegrooveOS - shared mkosi configuration
#
# Targets: Raspberry Pi 4, Raspberry Pi 5, Compute Module 4, Compute Module 5
# Host:    Fedora, mkosi 24.3
#
# Verified against mkosi 24.3 (the version packaged for Fedora 41). Setting
# names and their sections were checked against the mkosi.md shipped in that
# RPM -- in particular note that Bootable= and Bootloader= live in [Content],
# not [Output].

[Config]
# 24.3 is what Fedora 41 ships; refuse to build with anything older.
MinimumVersion=24

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64
# raspi-firmware lives in non-free-firmware for trixie. mkosi builds the
# component list as ("main", *Repositories), so this appends rather than
# replaces, and the image ends up self-contained.
Repositories=non-free-firmware

[Output]
Format=disk
OutputDirectory=build
ImageId=regrooveos
# Mirrored into IMAGE_ID/IMAGE_VERSION in /usr/lib/os-release. The user-facing
# strings (NAME, PRETTY_NAME, VERSION) are hand-written in
# mkosi.extra/usr/lib/os-release and are not derived from these; keep the two
# in step by hand.
ImageVersion=1
# mkosi.repart/ is the default location; named explicitly so the intent is
# visible. Declaring it suppresses mkosi's built-in ESP/BIOS/root defaults,
# which is required here -- see mkosi.repart/00-boot.conf.
RepartDirectories=mkosi.repart

# NOT optional on Raspberry Pi hardware. The Pi firmware's FAT driver
# (start4.elf) only understands 512-byte logical sectors; upstream's own
# words are that 4K sector support is "a fairly invasive change ... on the
# todo list". systemd-repart defaults the *filesystem* sector size to 4K
# whenever it is not operating on a real block device
# Left unset, the boot partition is built as FAT32 with 4096-byte sectors,
# which the firmware cannot read: the image builds cleanly and then does
# not boot.
#
# Verified rather than assumed: without this setting `file -s` reports
# "4096 bytes per logical sector" on the boot partition.
SectorSize=512

[Content]
# The Raspberry Pi bootloader is NOT UEFI. Leaving Bootable= on would make
# mkosi install an EFI bootloader and inject an ESP that the Pi firmware
# cannot use, and it would fail outright because our repart definitions
# provide no ESP. The boot partition and kernel are placed by mkosi.repart/.
Bootable=no
Bootloader=none

# Deliberately lean. Anything needed to work *on* the device rather than to
# run a rehosted firmware belongs in mkosi.profiles/dev.conf.
Packages=
    systemd
    systemd-sysv
    systemd-resolved
    # No usrmerge here, deliberately. The tree is already merged-/usr as far
    # as Debian merges it: base-files ships /bin, /sbin and /lib as symlinks
    # into /usr and provides the usr-is-merged virtual. usrmerge would not
    # change that -- its README states it will not merge /usr/bin and
    # /usr/sbin -- and that split is exactly what systemd's "unmerged-bin"
    # taint tag reports. Debian's systemd maintainers close that taint as
    # normal for bookworm/trixie (Debian bug #1089022, wontfix), and forcing
    # the symlink breaks the merged-usr preinst checks in udev and systemd.
    # The conversion tooling lives in the dev profile instead.
    # Debian ships udev as its own package and systemd does not depend on it.
    # Without it nothing populates /dev/disk/by-partuuid/, so
    # boot-firmware.mount waits 90 seconds for a device that never appears
    # (and the boot then limps on with no display modules and no network);
    # no device gets its modalias probed either. The kernel still mounts the
    # root via root=PARTUUID=, which is why the boot looks half-alive.
    udev
    util-linux
    # agetty execs /bin/login, and Debian splits that out of util-linux into
    # this package. Without it every getty -- tty1 and the serial console
    # alike -- exits immediately and systemd restarts it in a loop, so the
    # image boots to no prompt anywhere and nothing in the build complains.
    login
    kmod
    ca-certificates
    # Raspberry Pi firmware blobs (start*.elf, fixup*.dat, bootcode.bin).
    # Installed to /boot/firmware by the package, which is exactly where
    # 00-boot.conf picks the boot partition up from.
    raspi-firmware
    # The kernel requires a signed regulatory database
    # (CONFIG_CFG80211_REQUIRE_SIGNED_REGDB), and without these files cfg80211
    # prints "Direct firmware load for regulatory.db failed with error -2" at
    # every boot. It is harmless, but it is also the last line on an HDMI
    # console before systemd's output (which goes to the serial console) and
    # so reads as the place the boot stopped. 39 KiB buys a clean console.
    wireless-regdb
    # Audio. The rehosted firmwares drive ALSA directly; no sound server is
    # installed on purpose -- one less scheduler between DSP and hardware.
    libasound2
    alsa-utils
    alsa-ucm-conf
    # Realtime scheduling.
    rtkit
    # systemd-nspawn, for running the armv7hf drumlogue userfs natively via
    # AArch32 at EL0. See docs/os-base-decision.md.
    systemd-container

# No KernelCommandLine= here: with Bootloader=none mkosi never generates a
# UKI, so the kernel command line the Pi actually uses is the static
# mkosi.extra/boot/firmware/cmdline.txt.
