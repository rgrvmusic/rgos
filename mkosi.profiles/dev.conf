# Development profile.
#
#     mkosi --profile dev build
#
# Everything needed to work on the rehosted firmwares *on the device*,
# which the base image deliberately leaves out. Keep the base lean and put
# the product image on it; put the scratch space here.

[Output]
ImageId=regrooveos-dev

[Content]
# The dev image is where packages are installed on the device. apt is not in
# Debian's Essential set and mkosi installs packages on the host into the
# buildroot, so without these entries the image boots with dpkg but no apt.
# The sources list needs no shipping: mkosi writes
# /etc/apt/sources.list.d/<release>.sources into the image itself, but only
# when /usr/bin/apt exists -- with no apt package there was no file either.
# The production image deliberately stays without apt: it is rebuilt from this
# tree, not patched in the field.
Packages=
    apt
    # Supplies /usr/share/keyrings/debian-archive-keyring.gpg, which the
    # generated sources file names in Signed-By=.
    debian-archive-keyring
    # Conversion/assertion tooling for merged /usr, useful on a bench where
    # packages are installed and removed. It does NOT merge /usr/bin and
    # /usr/sbin, so it does not clear systemd's "unmerged-bin" taint -- Debian
    # keeps that split on purpose (bug #1089022, wontfix). Dev-only; the
    # production image has no use for it and stays without perl.
    usrmerge
    openssh-server
    podman
    nano
    less
    rsync
    strace
    htop
    iproute2
    iputils-ping
    curl

# Convenience only -- the dev image is for a bench or a desk, and the
# device is usually headless with no serial adapter to hand.
RootPassword=regroove
Autologin=yes
